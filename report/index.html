<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Report Tile - MONOLITH</title>
  <style>
    :root{
      --bg:#030914;
      --panel:#081827;
      --panel2:#0b2035;
      --line:#1f6fa8;
      --text:#eaf7ff;
      --muted:#9fc5dd;
      --accent:#49bfff;
      --bad:#fb7185;
      --good:#6ee7b7;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:radial-gradient(circle at top left,rgba(73,191,255,.16),transparent 32%),linear-gradient(180deg,#030914,#06111f 48%,#030914);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      line-height:1.5;
    }
    .wrap{max-width:920px;margin:0 auto;padding:28px 16px 70px}
    .hero,.card{
      border:1px solid rgba(122,211,255,.25);
      background:rgba(8,24,39,.88);
      border-radius:20px;
      padding:22px;
      margin-bottom:16px;
      box-shadow:0 18px 52px rgba(0,0,0,.28);
    }
    h1{margin:0 0 8px;font-size:32px}
    h2{margin:0 0 12px;color:var(--accent)}
    p{color:var(--muted)}
    label{display:block;margin:14px 0 6px;font-weight:800}
    input,select,textarea{
      width:100%;
      border:1px solid rgba(122,211,255,.28);
      background:#04111f;
      color:var(--text);
      border-radius:12px;
      padding:12px;
      font:inherit;
    }
    textarea{min-height:150px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    button,.btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(122,211,255,.35);
      background:#0b2035;
      color:#fff;
      border-radius:999px;
      padding:11px 16px;
      font-weight:900;
      text-decoration:none;
      cursor:pointer;
    }
    button.primary{background:linear-gradient(135deg,#49bfff,#1f6fa8)}
    .muted{color:var(--muted);font-size:13px}
    .status{margin-top:14px;font-weight:900}
    .ok{color:var(--good)}
    .bad{color:var(--bad)}
    .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
    @media(max-width:760px){.row{grid-template-columns:1fr}h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Report Tile</h1>
      <p>Use this form to report abuse, scams, impersonation, inappropriate content, misleading links, visual wall abuse, or abusive block clusters on MONOLITH.</p>
      <p class="muted">Reports are reviewed manually. Submitting a report does not automatically remove a tile.</p>
    </section>

    <section class="card">
      <form id="reportForm">
        <div class="hp">
          <label>Website</label>
          <input name="website" autocomplete="off">
          <label>Company</label>
          <input name="company" autocomplete="off">
        </div>

        <label for="coordinate">Tile Coordinate</label>
        <input id="coordinate" name="coordinate" placeholder="N1W1" required>

        <label for="reason">Reason</label>
        <select id="reason" name="reason" required>
          <option value="">Select reason</option>
          <option value="scam_phishing">Scam / phishing</option>
          <option value="malware">Malware</option>
          <option value="impersonation">Impersonation</option>
          <option value="harassment_threats_doxxing">Harassment / threats / doxxing</option>
          <option value="spam">Spam</option>
          <option value="misleading_link">Misleading link</option>
          <option value="trademark_brand_abuse">Trademark / brand abuse</option>
          <option value="pornographic_graphic_content">Pornographic or graphic content</option>
          <option value="hate_extremist_content">Hate / extremist content</option>
          <option value="visual_wall_abuse">Visual wall abuse</option>
          <option value="abusive_block_cluster">Abusive block cluster</option>
          <option value="inappropriate_content">Other inappropriate content</option>
          <option value="other">Other</option>
        </select>

        <label for="description">Short Description</label>
        <textarea id="description" name="description" placeholder="Tell us what is wrong with this tile. Minimum 10 characters." required></textarea>

        <div class="row">
          <div>
            <label for="reportedLink">Relevant Link / Profile</label>
            <input id="reportedLink" name="reportedLink" placeholder="https://...">
          </div>
          <div>
            <label for="reportedWallet">Relevant Wallet</label>
            <input id="reportedWallet" name="reportedWallet" placeholder="r...">
          </div>
        </div>

        <label for="reporterEmail">Your Email Optional</label>
        <input id="reporterEmail" name="reporterEmail" type="email" placeholder="you@example.com">

        <div class="btns">
          <button class="primary" id="submitBtn" type="submit">Submit Report</button>
          <a class="btn" id="tileLink" href="/monolith.html">Back to MONOLITH</a>
          <a class="btn" href="/rules.html#tile-abuse-report">View Rules</a>
        </div>

        <div class="status" id="status"></div>
      </form>
    </section>
  </main>

  <script>
  (function(){
    const qs = new URLSearchParams(location.search);
    const tile = (qs.get("tile") || "").trim().toUpperCase();
    const coordinate = document.getElementById("coordinate");
    const reportedLink = document.getElementById("reportedLink");
    const tileLink = document.getElementById("tileLink");
    const form = document.getElementById("reportForm");
    const status = document.getElementById("status");
    const btn = document.getElementById("submitBtn");

    if(tile){
      coordinate.value = tile;
      reportedLink.value = location.origin + "/tile/" + encodeURIComponent(tile);
      tileLink.href = "/tile/" + encodeURIComponent(tile);
      tileLink.textContent = "Back to Tile";
    }

    form.addEventListener("submit", async function(e){
      e.preventDefault();
      status.textContent = "";
      status.className = "status";
      btn.disabled = true;
      btn.textContent = "Submitting...";

      const fd = new FormData(form);
      const body = Object.fromEntries(fd.entries());
      body.tileUrl = location.origin + "/tile/" + encodeURIComponent(String(body.coordinate || "").trim().toUpperCase());

      try{
        const res = await fetch("/api/report/tile", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(body)
        });
        const data = await res.json().catch(()=>({}));
        if(!res.ok || !data.ok){
          throw new Error("report_submit_failed");
        }
        status.textContent = "Report received. MONOLITH will review it.";
        status.className = "status ok";
        form.reset();
        if(tile){
          coordinate.value = tile;
          reportedLink.value = location.origin + "/tile/" + encodeURIComponent(tile);
        }
      }catch(err){
        const raw=String(err&&err.message||"").toLowerCase();

        status.textContent =
          raw.includes("network") ||
          raw.includes("fetch")
            ? "MONOLITH could not be reached. Check your connection and try again."
            : "Your report could not be submitted. Please try again. If the problem continues, contact MONOLITH support.";

        status.className = "status bad";
      }finally{
        btn.disabled = false;
        btn.textContent = "Submit Report";
      }
    });
  })();
  </script>
</body>
</html>
