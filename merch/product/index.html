<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONOLITH Merch Store</title>
<link rel="icon" href="/assets/monolith_icon.webp">
<link rel="stylesheet" href="/merch/merch-shell.css">
<style>
.productPage{
  padding:28px 0 90px;
}

.productBack{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin:4px 0 20px;
  color:#657d89;
  font-size:11px;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.productBack:hover{
  color:#0878af;
}

.status{
  padding:24px;
  border:1px solid #d6e4eb;
  border-radius:16px;
  background:#fff;
  box-shadow:0 4px 16px rgba(42,75,92,.045);
  color:#657d89;
  font-size:13px;
}

.status.error{
  border-color:#efcaca;
  background:#fff8f8;
  color:#a83c3c;
}

.product{
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);
  gap:28px;
  align-items:start;
}

.gallery,
.details{
  overflow:hidden;
  border:1px solid #d6e4eb;
  border-radius:18px;
  background:#fff;
  box-shadow:0 4px 16px rgba(42,75,92,.045);
}

.hero{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:560px;
  padding:26px;
  background:#f8fcfe;
}

.hero img{
  display:block;
  width:100%;
  height:100%;
  max-height:620px;
  object-fit:contain;
}

.thumbs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:14px;
  border-top:1px solid #e5eef3;
  background:#fff;
}

.thumb{
  width:76px;
  height:76px;
  flex:0 0 76px;
  overflow:hidden;
  padding:0;
  border:1px solid #d6e4eb;
  border-radius:10px;
  background:#f8fcfe;
  cursor:pointer;
}

.thumb:hover{
  border-color:#159fe5;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.details{
  padding:30px;
}

.meta{
  margin-bottom:9px;
  color:#159fe5;
  font-size:10px;
  font-weight:950;
  letter-spacing:.11em;
  text-transform:uppercase;
}

h1{
  margin:0 0 12px;
  color:#17384a;
  font-size:clamp(30px,3vw,44px);
  line-height:1.05;
  letter-spacing:-.025em;
}

.seller{
  margin-bottom:24px;
  color:#657d89;
  font-size:13px;
}

.seller a{
  color:#0878af;
  font-weight:900;
}

.price{
  color:#17384a;
  font-size:32px;
  font-weight:950;
  letter-spacing:-.025em;
}

.xrp{
  margin:5px 0 18px;
  color:#159fe5;
  font-size:13px;
  font-weight:900;
}

.stock{
  display:inline-flex;
  align-items:center;
  min-height:27px;
  padding:0 10px;
  border:1px solid #bde2d1;
  border-radius:999px;
  background:#f4fcf8;
  color:#24734e;
  font-size:9px;
  font-weight:950;
  letter-spacing:.08em;
}

.stock.out{
  border-color:#efcaca;
  background:#fff8f8;
  color:#a83c3c;
}

.field{
  margin:24px 0;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:#405d6c;
  font-size:11px;
  font-weight:900;
}

.field select{
  width:100%;
  min-height:46px;
  padding:0 12px;
  border:1px solid #cbdce5;
  border-radius:10px;
  background:#fff;
  color:#17384a;
  outline:none;
}

.field select:focus{
  border-color:#159fe5;
  box-shadow:0 0 0 3px rgba(21,159,229,.1);
}

#optionsField{
  margin-top:18px;
}

.optionSelectors{
  display:grid;
  gap:12px;
}

.description{
  margin-top:25px;
  padding-top:24px;
  border-top:1px solid #e5eef3;
  color:#405d6c;
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
}

.shipping{
  margin-top:22px;
  padding:13px 14px;
  border:1px solid #d6e4eb;
  border-radius:10px;
  background:#f8fcfe;
  color:#657d89;
  font-size:11px;
  font-weight:700;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:22px;
}

.action{
  min-height:48px;
  padding:0 16px;
  border-radius:10px;
  font-size:11px;
  font-weight:950;
  letter-spacing:.04em;
  cursor:pointer;
}

.add{
  border:1px solid #b9ced9;
  background:#fff;
  color:#17384a;
}

.add:hover{
  border-color:#159fe5;
  color:#0878af;
}

.buy{
  border:1px solid #159fe5;
  background:#159fe5;
  color:#fff;
}

.buy:hover{
  background:#0878af;
  border-color:#0878af;
}

.action:disabled{
  opacity:.45;
  cursor:not-allowed;
}

@media(max-width:900px){
  .product{
    grid-template-columns:1fr;
  }

  .hero{
    min-height:420px;
  }
}

@media(max-width:600px){
  .productPage{
    padding-top:12px;
  }

  .details{
    padding:22px 18px;
  }

  .hero{
    min-height:340px;
    padding:14px;
  }

  .actions{
    grid-template-columns:1fr;
  }
}

.shareProductBtn{
  width:100%;
  min-height:44px;
  margin-top:10px;
  padding:0 16px;
  border:1px solid #cbdce5;
  border-radius:10px;
  background:#f8fcfe;
  color:#17384a;
  font-size:11px;
  font-weight:950;
  letter-spacing:.04em;
  cursor:pointer;
}

.shareProductBtn:hover{
  border-color:#159fe5;
  color:#0878af;
  background:#fff;
}

.shareStatus{
  min-height:18px;
  margin-top:7px;
  color:#657d89;
  font-size:10px;
  font-weight:800;
  text-align:center;
}

</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <a class="brand" href="/merch/">
      <img src="/assets/monolith_icon.webp" alt="MONOLITH">
      <span class="brandText">
        <strong>MONOLITH</strong>
        <small>MERCH STORE</small>
      </span>
    </a>

    <nav class="nav" aria-label="Merch navigation">
      <a class="active" href="/merch/">Shop</a>
      <a href="/merch/?buyerOrders=1">Orders</a>
      <a href="/merch/seller/">Sell</a>
      <a href="/merch/about/">About</a>
      <a href="/merch/help/">Help</a>
      <a href="/">Entrance</a>
    </nav>

    <div class="headerActions">
      <a class="payBtn" href="/merch/">
        $XRP CHECKOUT
      </a>
    </div>
  </header>

  <main class="productPage">
    <a class="productBack" href="/merch/">
      ← Back to Store
    </a>

    <div class="status" id="status">Loading product…</div>

  <section class="product" id="product" hidden>
    <div class="gallery">
      <div class="hero">
        <img id="heroImage" src="/assets/monolith_icon.webp" alt="">
      </div>
      <div class="thumbs" id="thumbs" hidden></div>
    </div>

    <div class="details">
      <div class="meta" id="meta"></div>
      <h1 id="title"></h1>
      <div class="seller" id="seller"></div>

      <div class="price" id="price"></div>
      <div class="xrp" id="xrp"></div>
      <div class="stock" id="stock"></div>

      <div id="optionsField" hidden>
        <div class="optionSelectors" id="optionSelectors"></div>
      </div>

      <div class="description" id="description"></div>
      <div class="shipping" id="shipping"></div>

      <div class="actions">
        <button class="action add" id="addBtn" type="button">
          Add to Cart
        </button>
        <button class="action buy" id="buyBtn" type="button">
          Buy with $XRP
        </button>
      </div>

      <button class="shareProductBtn" id="shareBtn" type="button">
        Share Product
      </button>
      <div class="shareStatus" id="shareStatus" aria-live="polite"></div>
    </div>
    </section>
  </main>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const productId = String(params.get("id") || "").trim();

  const status = document.getElementById("status");
  const productRoot = document.getElementById("product");
  const heroImage = document.getElementById("heroImage");
  const thumbs = document.getElementById("thumbs");
  const optionsField = document.getElementById("optionsField");
  const optionSelectors = document.getElementById("optionSelectors");
  const addBtn = document.getElementById("addBtn");
  const buyBtn = document.getElementById("buyBtn");
  const shareBtn = document.getElementById("shareBtn");
  const shareStatus = document.getElementById("shareStatus");

  let product = null;
  let xrpUsd = null;

  function esc(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function productOptionSelects(){
    return Array.from(
      optionSelectors.querySelectorAll(
        "[data-product-option]"
      )
    );
  }

  function variantMatchesSelections(
    variant,
    selections
  ){
    const values =
      Array.isArray(variant?.optionValues)
        ? variant.optionValues
        : [];

    return selections.every(
      selection =>
        values.some(
          item =>
            String(item.optionId) ===
              String(selection.optionId) &&
            String(item.valueId) ===
              String(selection.valueId)
        )
    );
  }

  function selectedVariant(){
    const variants =
      Array.isArray(product?.variants)
        ? product.variants
        : [];

    if (!variants.length) return null;

    const selects = productOptionSelects();

    if (
      !selects.length ||
      selects.some(select => !select.value)
    ) {
      return null;
    }

    const selections =
      selects.map(select => ({
        optionId:
          select.dataset.productOption,
        valueId:
          select.value
      }));

    return variants.find(
      variant =>
        variantMatchesSelections(
          variant,
          selections
        )
    ) || null;
  }

  function syncOptionAvailability(){
    const variants =
      Array.isArray(product?.variants)
        ? product.variants
        : [];

    const selects = productOptionSelects();

    for (let pass = 0; pass < 2; pass += 1) {
      selects.forEach(select => {
        Array.from(select.options)
          .slice(1)
          .forEach(option => {
            const selections = [];

            selects.forEach(other => {
              const valueId =
                other === select
                  ? option.value
                  : other.value;

              if (valueId) {
                selections.push({
                  optionId:
                    other.dataset.productOption,
                  valueId
                });
              }
            });

            option.disabled =
              !variants.some(
                variant =>
                  variant.available !== false &&
                  variantMatchesSelections(
                    variant,
                    selections
                  )
              );
          });
      });

      selects.forEach(select => {
        if (
          select.value &&
          select.selectedOptions[0]?.disabled
        ) {
          select.value = "";
        }
      });
    }
  }

  function renderProductOptions(){
    const options =
      Array.isArray(product?.options)
        ? [...product.options].sort(
            (a,b) =>
              Number(a.sortOrder || 0) -
              Number(b.sortOrder || 0)
          )
        : [];

    const variants =
      Array.isArray(product?.variants)
        ? product.variants
        : [];

    if (!options.length || !variants.length) {
      optionsField.hidden = true;
      optionSelectors.innerHTML = "";
      return;
    }

    optionsField.hidden = false;

    optionSelectors.innerHTML =
      options.map(option => {
        const values =
          Array.isArray(option.values)
            ? [...option.values].sort(
                (a,b) =>
                  Number(a.sortOrder || 0) -
                  Number(b.sortOrder || 0)
              )
            : [];

        return `
          <div class="field">
            <label>
              ${esc(option.name)}
            </label>

            <select
              data-product-option="${esc(option.optionId)}"
              aria-label="${esc(option.name)}"
            >
              <option value="">
                Select ${esc(option.name)}
              </option>

              ${values.map(value => `
                <option value="${esc(value.valueId)}">
                  ${esc(value.value)}
                </option>
              `).join("")}
            </select>
          </div>
        `;
      }).join("");

    productOptionSelects().forEach(
      select => {
        select.addEventListener(
          "change",
          () => {
            syncOptionAvailability();
            renderPrice();
            renderAvailability();
          }
        );
      }
    );

    syncOptionAvailability();
  }

  function effectiveUsd(){
    const variant = selectedVariant();
    return Number(variant?.priceUsd ?? product?.priceUsd ?? 0);
  }

  function renderPrice(){
    const usd = effectiveUsd();

    document.getElementById("price").textContent =
      `$${usd.toLocaleString(undefined,{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })}`;

    document.getElementById("xrp").textContent =
      xrpUsd && xrpUsd > 0
        ? `≈ ${(usd / xrpUsd).toLocaleString(undefined,{
            maximumFractionDigits:6
          })} $XRP`
        : "$XRP payment through MONOLITH";
  }

  function renderAvailability(){
    const variants =
      Array.isArray(product?.variants)
        ? product.variants
        : [];

    const options =
      Array.isArray(product?.options)
        ? product.options
        : [];

    const variant = selectedVariant();
    const stock = document.getElementById("stock");

    if (options.length && !variant) {
      stock.textContent =
        variants.length
          ? "SELECT OPTIONS"
          : "OPTIONS UNAVAILABLE";
      stock.classList.remove("out");
      addBtn.disabled = true;
      buyBtn.disabled = true;
      return;
    }

    const available =
      variant
        ? variant.available !== false
        : product.available !== false;

    stock.textContent =
      available ? "AVAILABLE" : "SOLD OUT";

    stock.classList.toggle(
      "out",
      !available
    );

    addBtn.disabled = !available;
    buyBtn.disabled = !available;
  }

  function handoff(buyNow){
    if (!product) return;

    const variants =
      Array.isArray(product.variants)
        ? product.variants
        : [];

    const options =
      Array.isArray(product.options)
        ? product.options
        : [];

    const variant = selectedVariant();

    if (options.length && !variant) {
      const firstIncomplete =
        productOptionSelects().find(
          select => !select.value
        );

      firstIncomplete?.focus();
      return;
    }

    const url = new URL("/merch/", location.origin);

    url.searchParams.set(
      "merchProduct",
      product.productId
    );

    if (variant) {
      url.searchParams.set(
        "variant",
        variant.variantId
      );
    }

    if (buyNow) {
      url.searchParams.set(
        "buyNow",
        "1"
      );
    }

    location.href = url.pathname + url.search;
  }


  async function shareProduct(){
    if (!product) return;

    const title =
      product.title ||
      "MONOLITH Product";

    const url =
      new URL(location.href);

    url.search = "";
    url.searchParams.set(
      "id",
      product.productId
    );

    const primaryMedia =
      Array.isArray(product.media)
        ? product.media.find(
            item =>
              item &&
              item.url &&
              (!item.mediaType || item.mediaType === "image")
          )
        : null;

    const shareVersion =
      primaryMedia?.mediaId ||
      product.productId;

    url.searchParams.set(
      "v",
      shareVersion
    );

    const shareData = {
      title: `${title} | MONOLITH Merch Store`,
      text: `${title} — Buy with $XRP on MONOLITH`,
      url: url.toString()
    };

    if (navigator.share) {
      try{
        await navigator.share(shareData);
        shareStatus.textContent = "";
        return;
      }catch(error){
        if (error && error.name === "AbortError") {
          return;
        }
      }
    }

    try{
      await navigator.clipboard.writeText(
        shareData.url
      );

      shareStatus.textContent =
        "Product link copied.";

      window.setTimeout(
        () => {
          shareStatus.textContent = "";
        },
        2200
      );
    }catch(_){
      shareStatus.textContent =
        shareData.url;
    }
  }

  async function loadRate(){
    try{
      const response = await fetch("/api/rates/xrp");
      const data = await response.json();
      const value = Number(data?.rate?.xrpUsd);

      xrpUsd =
        Number.isFinite(value) && value > 0
          ? value
          : null;
    }catch(_){
      xrpUsd = null;
    }
  }

  async function load(){
    if (!productId) {
      status.className = "status error";
      status.textContent = "Product not found.";
      return;
    }

    try{
      await loadRate();

      const response = await fetch(
        `/api/merch/product/${encodeURIComponent(productId)}`
      );

      const data = await response.json();

      if (!response.ok || !data.ok || !data.product) {
        throw new Error(data.error || "product_not_found");
      }

      product = data.product;

      document.title =
        `${product.title} | MONOLITH Merch Store`;

      document.getElementById("meta").textContent =
        product.productType ||
        product.category ||
        "MONOLITH MERCH";

      document.getElementById("title").textContent =
        product.title || "MONOLITH Product";

      const sellerName =
        product.vendor ||
        product.coordinate ||
        "Verified MONOLITH Seller";

      document.getElementById("seller").innerHTML =
        product.coordinate
          ? `${esc(sellerName)} · <a href="/tile/${encodeURIComponent(product.coordinate)}">${esc(product.coordinate)}</a>`
          : esc(sellerName);

      document.getElementById("description").textContent =
        product.description ||
        "No product description provided.";

      document.getElementById("shipping").textContent =
        product.requiresShipping
          ? "Physical product · Shipping calculated during checkout."
          : "No shipping required for this product.";

      const media =
        Array.isArray(product.media)
          ? product.media.filter(
              item =>
                item &&
                item.url &&
                (!item.mediaType || item.mediaType === "image")
            )
          : [];

      if (media.length) {
        heroImage.src = media[0].url;
        heroImage.alt = media[0].altText || product.title || "";

        if (media.length > 1) {
          thumbs.hidden = false;

          thumbs.innerHTML = media.map(
            item => `
              <button
                class="thumb"
                type="button"
                data-src="${esc(item.url)}"
                data-alt="${esc(item.altText || product.title || "")}"
              >
                <img
                  src="${esc(item.url)}"
                  alt="${esc(item.altText || product.title || "")}"
                >
              </button>
            `
          ).join("");

          thumbs.querySelectorAll("[data-src]").forEach(
            button => {
              button.addEventListener("click", () => {
                heroImage.src = button.dataset.src;
                heroImage.alt =
                  button.dataset.alt ||
                  product.title ||
                  "";
              });
            }
          );
        }
      }

      renderProductOptions();
      renderPrice();
      renderAvailability();

      status.hidden = true;
      productRoot.hidden = false;

    }catch(error){
      console.error("[merch:product]", error);

      status.className = "status error";
      status.textContent =
        "This product is unavailable or could not be loaded.";
    }
  }

  addBtn.addEventListener("click", () => handoff(false));
  buyBtn.addEventListener("click", () => handoff(true));
  shareBtn.addEventListener("click", shareProduct);

  load();
})();
</script>
</body>
</html>
