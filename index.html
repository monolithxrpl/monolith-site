<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MONOLITH</title>

<style>
:root{
  --bg:#07090b;
  --fg:#f5f7f4;
  --muted:rgba(245,247,244,.75);
  --green:#2fbf6b;
  --line:rgba(23,53,36,.95);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui;
  background:var(--bg);
  color:var(--fg);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
}

.card{
  width:100%;
  max-width:640px;
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  background:rgba(7,9,11,.8);
}

h1{
  font-size:18px;
  font-weight:900;
  letter-spacing:.5px;
}

p{
  margin-top:10px;
  color:var(--muted);
  font-weight:700;
  line-height:1.4;
}

.actions{
  margin-top:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  padding:12px 14px;
  border-radius:14px;
  font-weight:900;
  text-decoration:none;
}

.primary{
  background:rgba(47,191,107,.2);
  border-color:rgba(47,191,107,.6);
}
</style>
</head>

<body>

<div class="card">
  <h1>MONOLITH</h1>

  <p>
  This is a permanent coordinate system on the XRP Ledger.
  Each tile is a fixed location tied to a wallet.
  </p>

  <p>
  Coordinates follow a strict order:
  <strong>North / South first, then East / West.</strong>
  </p>

  <div class="actions">
    <a class="btn primary" href="/monolith.html">Enter the Wall</a>
    <a class="btn" href="/claim/">Claim a Tile</a>
  </div>
</div>

</body>
</html>
