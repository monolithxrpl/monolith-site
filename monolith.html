<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://monolithxrpl.com/assets/monolith_logo.webp" />
  <meta property="og:url" content="https://monolithxrpl.com/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0b1b13;
      --panel2:#0d2217;
      --fg:#f5f7f4;
      --muted:#aeb7af;
      --line:#1f6fa8;
      --green:#49bfff;
      --warn:#ffe175;
      --red:#ff5b5b;

      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(73,191,255,.12), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,225,117,.10), transparent 55%),
        var(--bg);
      color:var(--fg);
      overflow:hidden;
    }
    a{color:inherit;text-decoration:none}

    .top{
      position:fixed;left:12px;right:12px;top:12px;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(73,191,255,.9);
      border-radius:18px;
      background:rgba(7,9,11,.62);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      z-index:20;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:34px;height:34px;object-fit:contain}
    .brand .t{font-weight:1000;letter-spacing:.6px;font-size:13px;text-transform:uppercase;line-height:1.1}
    .brand .s{margin-top:3px;color:rgba(245,247,244,.72);font-size:12px;line-height:1.2}
    .sp{flex:1}

    .btn{
      border:1px solid rgba(73,191,255,.95);
      background:rgba(7,24,39,.85);
      color:var(--fg);
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      letter-spacing:.3px;
      cursor:pointer;
      display:inline-flex;align-items:center;gap:8px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{border-color:rgba(73,191,255,.55)}
    .btn.primary{
      background:linear-gradient(180deg, rgba(73,191,255,.22), rgba(7,24,39,.88));
      border-color:rgba(73,191,255,.65);
    }

    .kpi{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      color:rgba(245,247,244,.84);
      font-size:12px;
    }
    .pill{
      border:1px solid rgba(73,191,255,.95);
      background:rgba(7,24,39,.72);
      padding:8px 10px;
      border-radius:999px;
      font-weight:900;
      letter-spacing:.2px;
      display:inline-flex;align-items:center;gap:8px;
    }
    .dot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 0 3px rgba(73,191,255,.18)}

    .search{
      display:flex;align-items:center;gap:8px;
      border:1px solid rgba(73,191,255,.95);
      background:rgba(7,24,39,.72);
      border-radius:14px;
      padding:8px 10px;
    }
    .search input{
      width:240px;
      max-width:42vw;
      border:0;
      outline:0;
      background:transparent;
      color:var(--fg);
      font-weight:900;
      letter-spacing:.2px;
      font-size:12px;
    }
    .search input::placeholder{color:rgba(174,183,175,.70)}
    .search .btn{
      padding:8px 10px;
      border-radius:12px;
    }

    @media (max-width: 700px){
      .top{
        left:8px; right:8px; top:8px;
        gap:8px;
        padding:8px 9px;
        border-radius:14px;
      }
      .brand img{width:28px;height:28px}
      .brand .t{font-size:12px}
      .brand .s{font-size:11px;margin-top:1px}
      .sp{display:none}
      .search{
        order:3;
        width:100%;
        padding:6px 8px;
        gap:6px;
        border-radius:12px;
      }
      .search input{
        width:100%;
        max-width:none;
        font-size:11px;
      }
      .search .btn{
        padding:7px 9px;
        font-size:11px;
      }
      .kpi{
        width:100%;
        gap:6px;
      }
      .btn{
        padding:8px 10px;
        font-size:11px;
        border-radius:12px;
      }
      .pill{
        padding:6px 8px;
        font-size:11px;
      }
    }

    #vp{
      position:absolute;inset:0;
      touch-action:none;
      cursor:grab;
    }
    #vp.dragging{cursor:grabbing}
    #world{
      position:absolute;left:0;top:0;
      width:1px;height:1px;
      transform:translate3d(0,0,0);
      will-change:transform;
      transform-origin: 0 0;
    }

    .cell{
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
  user-drag: none;
  touch-action: none;
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:16px;
      border:1px solid rgba(73,191,255,.75);
      background:
        radial-gradient(120px 90px at 30% 25%, rgba(73,191,255,.14), transparent 55%),
        rgba(7,24,39,.45);
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
      overflow:hidden;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
      .cell .mediaWrap{width:100%;height:100%;}
      .cell .mediaWrap img{width:100%;height:100%;object-fit:cover;opacity:.22;}


.cell img{
  -webkit-user-drag: none;
  user-drag: none;
}
    .cell:hover{border-color:rgba(73,191,255,.45)}
    .cell .spray{position:absolute;inset:0;opacity:.95}

    .cell .mediaWrap{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      padding:10px;
    }
    .cell .mediaWrap img{
      width:88%;
      height:88%;
      object-fit:contain;
      opacity:.95;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }

    .cell .id{
      position:absolute;left:10px;bottom:8px;right:10px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.35px;
      color:rgba(245,247,244,.72);
      text-shadow:0 1px 0 rgba(0,0,0,.55);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      z-index:3;
    }
    .cell .tag{
      position:absolute;left:10px;top:8px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.5px;
      color:rgba(255,225,117,.85);
      text-transform:uppercase;
      text-shadow:0 1px 0 rgba(0,0,0,.55);
      max-width:calc(100% - 20px);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      z-index:3;
    }
    .cell.taken{border-color:rgba(73,191,255,.85)}
    .cell.taken .tag{color:rgba(73,191,255,.92)}

    .panel{
      position:fixed;
      right:12px;
      top:70px;
      bottom:12px;
      width:min(420px, calc(100vw - 24px));
      border-radius:18px;
      border:1px solid rgba(73,191,255,.95);
      background:linear-gradient(180deg, rgba(8,24,39,.86), rgba(7,24,39,.92));
      box-shadow:0 18px 44px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      z-index:30;
      transform:translate3d(110%,0,0);
      transition:transform .18s ease;
      display:flex;flex-direction:column;
    }
    .panel.open{transform:translate3d(0,0,0)}
    .ph{
      display:flex;align-items:center;gap:10px;
      padding:12px;
      border-bottom:1px solid rgba(73,191,255,.9);
    }
    .ph .ttl{font-weight:1000;letter-spacing:.4px}
    .ph .sub{margin-top:3px;color:rgba(245,247,244,.70);font-size:12px}
    .ph .sp{flex:1}
    .xbtn{
      width:40px;height:40px;border-radius:14px;
      border:1px solid rgba(73,191,255,.95);
      background:rgba(7,9,11,.4);
      color:rgba(245,247,244,.9);
      font-weight:1000;
      cursor:pointer;
    }
    .pb{padding:12px;overflow:auto}

    .kv{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:10px 12px;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(73,191,255,.75);
      background:rgba(7,9,11,.22);
    }
    .kv .k{color:rgba(174,183,175,.85);font-size:12px;font-weight:900;letter-spacing:.4px;text-transform:uppercase}
    .kv .v{font-size:13px;font-weight:1000;letter-spacing:.2px;word-break:break-word;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .muted{color:rgba(174,183,175,.86);font-size:12px;line-height:1.45;margin-top:10px;white-space:pre-wrap}

    .copy{
      border:1px solid rgba(73,191,255,.95);
      background:rgba(7,9,11,.35);
      color:rgba(245,247,244,.92);
      border-radius:999px;
      padding:6px 10px;
      font-weight:1000;
      letter-spacing:.2px;
      font-size:11px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .copy:hover{border-color:rgba(73,191,255,.55)}

    .linka{
      border:1px solid rgba(73,191,255,.95);
      background:rgba(7,9,11,.26);
      color:rgba(245,247,244,.94);
      border-radius:999px;
      padding:6px 10px;
      font-weight:1000;
      letter-spacing:.2px;
      font-size:11px;
      display:inline-flex;align-items:center;gap:8px;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .linka:hover{border-color:rgba(73,191,255,.55)}

    .badge{
      border:1px solid rgba(73,191,255,.55);
      background:rgba(73,191,255,.12);
      color:rgba(245,247,244,.92);
      border-radius:999px;
      padding:5px 9px;
      font-weight:1000;
      letter-spacing:.2px;
      font-size:11px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:14px;
      transform:translate3d(-50%, 90px, 0);
      opacity:0;
      transition:transform .18s ease, opacity .18s ease;
      z-index:40;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(73,191,255,.95);
      background:rgba(7,9,11,.72);
      backdrop-filter: blur(10px);
      font-weight:1000;
      letter-spacing:.2px;
      font-size:12px;
      max-width:90vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.show{transform:translate3d(-50%, 0, 0);opacity:1}
    .toast.good{border-color:rgba(73,191,255,.75)}
    .toast.warn{border-color:rgba(255,225,117,.75)}
    .toast.bad{border-color:rgba(255,91,91,.75)}
  
    /* panel tile image */

.vMedia{display:flex;justify-content:center;align-items:center;padding:10px 0;}
#vMedia img{width:100%;max-width:260px;height:auto;display:block;border-radius:10px;}


    /* EMPTY_TILE_XRP_BG_FINAL */
    #wall .cell:not(.taken){
      background-color:#020703 !important;
      background-image:url("/assets/xrp_logo.webp"), url("/assets/xrp_logo.png") !important;
      background-repeat:no-repeat !important;
      background-position:center !important;
      background-size:cover !important;
    }
  

/* PANEL scroll */
.panel{
  max-height: calc(100vh - 24px);
  overflow: hidden;
}
.panel .pb{
  overflow: auto;
  max-height: calc(100vh - 110px);
  -webkit-overflow-scrolling: touch;
}

/* NOTE wrap, no spill */
#vNote{
  display:block;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* CARD uniform clamp */
.panel{box-sizing:border-box;}
.panel *{box-sizing:border-box;}
.pb{overflow:auto;overflow-x:hidden;}
.row{min-width:0;max-width:100%;}
.k{flex:0 0 auto;}
.v{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;word-break:break-word;}
#vLinkWrap a,#vWalletWrap,#vHandleWrap{display:block;max-width:100%;overflow-wrap:anywhere;word-break:break-word;}
.panel img{display:block;max-width:100%;height:auto;object-fit:contain;}


/* DEBUG HUD */
#dbg{display:none;position:fixed;left:10px;bottom:10px;z-index:99999;background:rgba(0,0,0,.75);color:#fff;font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:8px 10px;border-radius:10px;max-width:min(92vw,560px);white-space:pre-wrap;}
body.debug #dbg{display:block;}

#vBody{display:none;}

/* BLACK SEA FIX v1 */
#vp{background:var(--bg);}
#world{background:var(--bg);}


/* Entry Default View: MONOLITH middle view */
body.view-default .cell{
  background:rgba(3,14,26,.82) !important;
  border-color:rgba(73,191,255,.28) !important;
}
body.view-default .cell .id{display:none !important;}
body.view-default .cell .tag{
  display:block !important;
  color:#eaf7ff !important;
  letter-spacing:.08em;
  text-shadow:0 0 10px rgba(73,191,255,.35);
}
body.view-default .cell .spray{
  filter:saturate(1.08) contrast(1.08);
}

/* Brand View and Satellite View: images only */
body.view-brand .cell .id,
body.view-brand .cell .tag,
body.view-imageonly .cell .id,
body.view-imageonly .cell .tag{ display:none !important; }
body.view-brand .cell .spray,
body.view-imageonly .cell .spray{ filter:none; }


/* mobile green-bar bleed kill */
@media (max-width: 900px){
  html,
  body{
    background:#030914 !important;
    background-image:none !important;
  }

  body::before,
  body::after,
  .app::before,
  .app::after,
  .viewport::before,
  .viewport::after,
  .wall::before,
  .wall::after,
  .wall-wrap::before,
  .wall-wrap::after,
  .grid::before,
  .grid::after,
  .board::before,
  .board::after{
    display:none !important;
    content:none !important;
    background:none !important;
    background-image:none !important;
    box-shadow:none !important;
    filter:none !important;
    opacity:0 !important;
  }
}


/* Mobile wall button collapse */
.mobile-wall-toggle{display:none;}

@media (max-width:900px){
  .mobile-wall-toggle{
    position:fixed;
    top:12px;
    right:12px;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    border:1px solid rgba(73,191,255,.38);
    border-radius:999px;
    background:rgba(3,12,24,.88);
    color:#eaf7ff;
    font-size:20px;
    line-height:1;
    box-shadow:0 0 18px rgba(0,0,0,.45);
  }

  body.wall-buttons-collapsed .top .search,
  body.wall-buttons-collapsed .top .kpi{
    display:none !important;
  }

  body.wall-buttons-collapsed .mobile-wall-toggle{
    transform:rotate(180deg);
  }
}


/* MONOLITH_WALL_ZOOM_CONTROLS_SAFE_20260523_START */
.wall-zoom-controls{
  position:fixed;
  right:calc(14px + env(safe-area-inset-right, 0px));
  bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:8px;
  border:1px solid rgba(72,191,255,.35);
  border-radius:18px;
  background:rgba(5,10,16,.78);
  backdrop-filter:blur(12px);
  box-shadow:0 14px 35px rgba(0,0,0,.35);
  pointer-events:auto;
}
.wall-zoom-controls button{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid rgba(72,191,255,.48);
  background:rgba(8,18,28,.94);
  color:#eaf8ff;
  font-size:24px;
  font-weight:900;
  line-height:1;
  cursor:pointer;
  touch-action:manipulation;
  pointer-events:auto;
  user-select:none;
  -webkit-user-select:none;
}
.wall-zoom-controls button:hover{
  border-color:rgba(72,191,255,.85);
  box-shadow:0 0 18px rgba(72,191,255,.22);
}
@media(max-width:680px){
  .wall-zoom-controls{
    right:10px;
    bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    gap:7px;
    padding:7px;
  }
  .wall-zoom-controls button{
    width:39px;
    height:39px;
    border-radius:13px;
    font-size:22px;
  }
}
/* MONOLITH_WALL_ZOOM_CONTROLS_SAFE_20260523_END */

</style>

    background:#49bfff!important;
    box-shadow:0 0 0 3px rgba(73,191,255,.20), 0 0 14px rgba(73,191,255,.35)!important;
  }

  .cell.taken,
  .cell.locked,
  .cell.claimed,

    border-color:rgba(73,191,255,.28)!important;

      inset 0 0 0 1px rgba(122,211,255,.09),

  }

  .cell.taken,

    function tileIdFromCoords(gx, gy){

}

function coordLabelFromG(gx, gy){
  gx = Number(gx)||0;
  gy = Number(gy)||0;
  if(gx===0 && gy===0) return "ORIGIN";

  const ax = Math.abs(gx);

  const y = gy>0 ? `N-${ay}` : gy<0 ? `S-${ay}` : "N-0";

  if(x && y) return `${y} / ${x}`;
  return x || y;
}


    function parseQueryToCoords(str){
      let raw = String(str || "").trim().toUpperCase().replace(/[–—−]/g, "-");
      // Option A labels: "N-11 / E-23" or "N-11/E-23" or "W-5"
      const raw0 = String(str || "").trim().toUpperCase();
      if(raw0 === "ORIGIN"){
        return { gx:0, gy:0, tile: tileIdFromCoords(0,0), raw: raw0 };
      }
      if(raw0.includes("N-") || raw0.includes("S-") || raw0.includes("E-") || raw0.includes("W-")){
        const parts = raw0.replace(/\s+/g,"").split("/");
        let gx = null, gy = null;
        for(const part of parts){
          const m = part.match(/^([NSEW])\-?(\d+)$/);
          if(!m) continue;
          const d = m[1];
          const n = parseInt(m[2], 10);
          if(d === "E") gx = n;
          else if(d === "W") gx = -n;
          else if(d === "N") gy = n;
          else if(d === "S") gy = -n;
        }
        if(gx !== null || gy !== null){
          gx = (gx === null) ? 0 : gx;
          gy = (gy === null) ? 0 : gy;
          return { gx, gy, tile: tileIdFromCoords(gx,gy), raw: raw0 };
        }
      }

      raw = raw.replace(/\s+/g, "");

      if(/^-?\d+,\s*-?\d+$/.test(raw)){
        const parts = raw.split(",");
        const gx = parseInt(parts[0].trim(), 10);
        const gy = parseInt(parts[1].trim(), 10);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      let m = raw.match(/^([NS])(\d+)-([EW])(\d+)$/);
      if(m){
        const gyN = parseInt(m[2], 10);
        const gy = (m[1] === "N" ? gyN : -gyN);
        const gxE = parseInt(m[4], 10);
        const gx = (m[3] === "E" ? gxE : -gxE);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      m = raw.match(/^([NS])(\d+)([EW])(\d+)$/);
      if(m){
        const gyN = parseInt(m[2], 10);
        const gy = (m[1] === "N" ? gyN : -gyN);
        const gxE = parseInt(m[4], 10);
        const gx = (m[3] === "E" ? gxE : -gxE);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      m = raw.match(/^([EW])(\d+)-([NS])(\d+)$/);
      if(m){
        const gx = parseInt(m[2], 10) * (m[1] === "W" ? -1 : 1);
        const gyN = parseInt(m[4], 10);
        const gy = (m[3] === "N" ? gyN : -gyN);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      m = raw.match(/^([EW])(\d+)([NS])(\d+)$/);
      if(m){
        const gx = parseInt(m[2], 10) * (m[1] === "W" ? -1 : 1);
        const gyN = parseInt(m[4], 10);
        const gy = (m[3] === "N" ? gyN : -gyN);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      return null;
    }

    function mulberry32(seed){
      let t = seed >>> 0;
      return function(){
        t += 0x6D2B79F5;
        let x = Math.imul(t ^ (t >>> 15), 1 | t);
        x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hashStr(str){
      let h = 2166136261 >>> 0;
      for(let i=0;i<str.length;i++){
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function makeSpraySVG(seedStr){
      const rnd = mulberry32(hashStr(seedStr));
      const p = [];
      const count = 26;

      for(let i=0;i<count;i++){
        const x = Math.floor(rnd() * TILE);
        const y = Math.floor(rnd() * TILE);
        const r = 6 + Math.floor(rnd() * 20);
        const a = 0.10 + rnd() * 0.22;
        const g = rnd() < 0.72 ? "47,191,107" : "255,225,117";
        p.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(${g},${a.toFixed(3)})" />`);
      }
      return `<svg viewBox="0 0 ${TILE} ${TILE}" width="${TILE}" height="${TILE}" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
    }

      const ns = gy>0 ? "N"+gy : (gy<0 ? "S"+Math.abs(gy) : "");
      const ew = gx>0 ? "E"+gx : (gx<0 ? "W"+Math.abs(gx) : "");
      return ns + ew;
    }

        if(mark) return mark;
      }
      return null;
    }

      return tag === "YOUR BRAND HERE";
    }

    function cleanLinkRaw(s){

    function isXHandle(v){

    function isHttpsUrl(v){
      if(!v.startsWith("https://")) return false;
      if(v.length < 9) return false;
      if(v.length > 120) return false;
      if(/[<>\s]/.test(v)) return false;
      return true;
    }

    function shortUrl(u){
      if(u.length <= 44) return u;
      const a = u.slice(0, 26);

        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = shortUrl(raw);
